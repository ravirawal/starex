<section class="blog-section py50">
  <div class="container">
    <h2 class="section-title">Latest Blog Posts</h2>
   <div class="blog-grid">
  <div class="blog-card" *ngFor="let post of blogPosts">
    <a [href]="post.link">
      <div class="image-wrapper ratio-16x9">
        <img [src]="post.image" [alt]="post.alt">
      </div>
    </a>
    <div class="blog-meta">
      <span><strong>Posted By:</strong> {{ post.author }}</span>
      <span class="date"><strong>Posted On:</strong> {{ post.date }}</span>
    </div>
    <a [href]="post.link">
      <h4 class="blog-title">{{ post.title }}</h4>
    </a>
    <a [href]="post.link" class="read-more">Read More</a>
  </div>
</div>

  </div>
</section>
