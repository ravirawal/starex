<section class="starex-news py50">
  <div class="container">
    <h1 class="section-title">Starex Events</h1>

    <div class="news-grid">
      <div class="news-card" *ngFor="let item of eventsData">
        <img [src]="item.image" [alt]="item.title" scrollReveal />
        <div class="news-text">
          <h4>{{ item.title }}</h4>
          <p class="news-date"><mat-icon>calendar_today</mat-icon> {{ item.date }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
