<mat-card class="mat-elevation-z4 mb-4">
  <mat-card-header>
    <mat-card-title class="text-primary">📄 IPR Policies</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-accordion multi>
      
      <!-- IPR Policy Panel -->
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>IPR Policy</mat-panel-title>
        </mat-expansion-panel-header>
        <div class="policy-link">
          <a mat-stroked-button color="primary" target="_blank"
             href="https://www.starexuniversity.com/pdf/IPR_Policy_of_SUG-converted-pages-1-8.pdf">
            <mat-icon>picture_as_pdf</mat-icon> View IPR Policy
          </a>
        </div>
      </mat-expansion-panel>

      <!-- Anti Ragging Policy Panel -->
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>Anti Ragging Policy</mat-panel-title>
        </mat-expansion-panel-header>
        <div class="policy-link">
          <a mat-stroked-button color="warn" target="_blank"
             href="https://www.starexuniversity.com/pdf/Anti_Ragging_Policy_New.pdf">
            <mat-icon>picture_as_pdf</mat-icon> View Anti Ragging Policy
          </a>
        </div>
      </mat-expansion-panel>

    </mat-accordion>
  </mat-card-content>
</mat-card>
